openapi: 3.1.1
info:
  title: Mahiron API
  description: Yet another DVR Tuner Server for Japanese TV
  contact:
    name: 21S1298001
    url: https://github.com/21S1298001
  version: 5.0.0
servers:
  - url: http://localhost:40772/api
tags:
  - name: channels
  - name: config
  - name: documents
  - name: events
  - name: iptv
  - name: job
  - name: log
  - name: misc
  - name: programs
  - name: services
  - name: status
  - name: stream
  - name: tuners
  - name: version
paths:
  /config/server:
    parameters: []
    get:
      tags:
        - config
      operationId: getServerConfig
      description: Returns an empty object. Mahiron does not expose its server configuration through the API.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigServer"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /version:
    parameters: []
    get:
      tags:
        - version
      operationId: checkVersion
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /docs:
    parameters: []
    get:
      tags:
        - documents
      operationId: getApiDocumentation
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tuners:
    parameters: []
    get:
      tags:
        - tuners
      operationId: getTuners
      parameters:
        - name: includeRemote
          in: query
          description: Include cached tuner status from configured remotes.
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TunerDevice"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /status:
    parameters: []
    get:
      tags:
        - status
      summary: Get Status
      operationId: getStatus
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /services:
    parameters: []
    get:
      tags:
        - services
      operationId: getServices
      parameters:
        - name: serviceId
          in: query
          schema:
            type: integer
        - name: networkId
          in: query
          schema:
            type: integer
        - name: name
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: integer
        - name: channel.type
          in: query
          schema:
            type: string
        - name: channel.channel
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /programs:
    parameters: []
    get:
      tags:
        - programs
      operationId: getPrograms
      parameters:
        - name: networkId
          in: query
          schema:
            type: integer
        - name: serviceId
          in: query
          schema:
            type: integer
        - name: eventId
          in: query
          schema:
            type: integer
        - name: startAt
          in: query
          description: Include programs that end at or after this Unix time in milliseconds.
          schema:
            type: integer
            format: int64
        - name: endAt
          in: query
          description: Include programs that start at or before this Unix time in milliseconds.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Program"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /log/stream:
    parameters: []
    get:
      tags:
        - log
        - stream
      operationId: getLogStream
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
        default:
          description: Unexpected Error
          content: {}
  /log:
    parameters: []
    get:
      tags:
        - log
      operationId: getLog
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
        default:
          description: Unexpected Error
          content: {}
  /jobs:
    parameters: []
    get:
      tags:
        - job
      operationId: getJobs
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobItem"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /job-schedules:
    parameters: []
    get:
      tags:
        - job
      operationId: getJobSchedules
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobScheduleItem"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /iptv/xmltv:
    parameters: []
    get:
      tags:
        - iptv
      summary: IPTV - XMLTV EPG Data
      responses:
        "200":
          description: OK
          content:
            text/xml:
              schema:
                type: string
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /iptv/playlist:
    parameters: []
    get:
      tags:
        - iptv
      summary: IPTV - M3U Playlist
      responses:
        "200":
          description: OK
          content:
            application/x-mpegURL:
              schema:
                type: string
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /iptv/lineup.json:
    parameters: []
    get:
      tags:
        - iptv
      summary: IPTV - Media Server Support
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IptvLineupItem"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /iptv/lineup_status.json:
    parameters: []
    get:
      tags:
        - iptv
      summary: IPTV - Media Server Support
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IptvLineupStatus"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /iptv/discover.json:
    parameters: []
    get:
      tags:
        - iptv
      summary: IPTV - Media Server Support
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IptvDiscover"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /events/stream:
    parameters: []
    get:
      tags:
        - events
        - stream
      operationId: getEventsStream
      parameters:
        - name: resource
          in: query
          schema:
            type: string
            enum:
              - program
              - service
              - tuner
              - job
              - job_schedule
        - name: type
          in: query
          schema:
            type: string
            enum:
              - create
              - update
              - remove
      responses:
        "200":
          description: OK
          content:
            text/plain:
              x-ogen-raw-response: true
              schema:
                type: string
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /events:
    parameters: []
    get:
      tags:
        - events
      operationId: getEvents
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /channels:
    parameters: []
    get:
      tags:
        - channels
      operationId: getChannels
      parameters:
        - name: type
          in: query
          schema:
            type: string
        - name: channel
          in: query
          schema:
            type: string
        - name: name
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Channel"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tuners/{index}/process:
    parameters: []
    get:
      tags:
        - tuners
      summary: Get Tuner Process Info
      operationId: getTunerProcess
      parameters:
        - name: index
          in: path
          required: true
          schema:
            minimum: 0
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TunerProcess"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - tuners
      summary: Kill Tuner Process
      operationId: killTunerProcess
      parameters:
        - name: index
          in: path
          required: true
          schema:
            minimum: 0
            type: integer
      responses:
        "204":
          description: Killed
          content: {}
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tuners/{index}:
    parameters: []
    get:
      tags:
        - tuners
      operationId: getTuner
      parameters:
        - name: index
          in: path
          required: true
          schema:
            minimum: 0
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TunerDevice"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /services/{id}/stream:
    parameters: []
    get:
      tags:
        - services
        - stream
      operationId: getServiceStream
      parameters:
        - name: id
          in: path
          required: true
          schema:
            maximum: 6553565535
            type: integer
            format: int64
        - name: X-Mirakurun-Priority
          in: header
          schema:
            minimum: -1
            type: integer
        - name: decode
          in: query
          schema:
            maximum: 1
            minimum: 0
            type: integer
      responses:
        "200":
          description: OK
          headers:
            X-Mirakurun-Tuner-User-ID:
              schema:
                type: string
          content:
            video/mp2t:
              schema:
                type: string
                format: binary
        "404":
          description: Not Found
          content: {}
        "503":
          description: Tuner Resource Unavailable
          content: {}
        default:
          description: Unexpected Error
          content: {}
    head:
      tags:
        - services
        - stream
      parameters:
        - name: id
          in: path
          required: true
          schema:
            maximum: 6553565535
            type: integer
            format: int64
        - name: X-Mirakurun-Priority
          in: header
          schema:
            minimum: -1
            type: integer
        - name: decode
          in: query
          schema:
            maximum: 1
            minimum: 0
            type: integer
      responses:
        "200":
          description: OK
          headers:
            X-Mirakurun-Tuner-User-ID:
              schema:
                type: string
          content: {}
        "404":
          description: Not Found
          content: {}
        "503":
          description: Tuner Resource Unavailable
          content: {}
        default:
          description: Unexpected Error
          content: {}
  /services/{id}/data-broadcast/bml/state:
    parameters: []
    get:
      description: >-
        Returns the current data-broadcast snapshot. Modules whose status is
        "rejected" are announced for diagnostics but must be excluded from a
        receiver's DII download list because no resource will become available.
        URL fields in the payload are absolute paths rooted at the API mount;
        clients deployed through a subpath proxy should construct request URLs
        from the endpoint paths instead.
        When no tuner is currently allocated for this channel, the response
        may be a provisional snapshot rebuilt from the last persisted PMT/DII
        state (origin "cache") instead of live state (origin "live"). A cache
        snapshot always has programInfo, currentTime, and pcr set to null,
        since those are clock/schedule samples rather than carousel state and
        a stale value would be misleading. Pass allowCache=0 to require live
        state, returning 404 instead of a cache snapshot.
      tags:
        - services
        - stream
      operationId: getServiceDataBroadcastState
      parameters:
        - name: id
          in: path
          required: true
          schema:
            maximum: 6553565535
            type: integer
            format: int64
        - name: allowCache
          in: query
          schema:
            maximum: 1
            minimum: 0
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              x-ogen-raw-response: true
              schema:
                $ref: "#/components/schemas/DataBroadcastSnapshot"
        "404":
          description: Not Found
          content: {}
        default:
          description: Unexpected Error
          content: {}
  /services/{id}/data-broadcast/bml/events:
    parameters: []
    get:
      description: >-
        Streams data-broadcast state changes. Modules whose status is
        "rejected" are announced for diagnostics but must be excluded from a
        receiver's DII download list because no resource will become available.
        URL fields in event payloads are absolute paths rooted at the API mount;
        clients deployed through a subpath proxy should construct request URLs
        from the endpoint paths instead.
        The data of each event is a DataBroadcastEvent.
      tags:
        - services
        - stream
      operationId: getServiceDataBroadcastEvents
      parameters:
        - name: id
          in: path
          required: true
          schema:
            maximum: 6553565535
            type: integer
            format: int64
        - name: X-Mirakurun-Priority
          in: header
          schema:
            minimum: -1
            type: integer
        - name: decode
          in: query
          schema:
            maximum: 1
            minimum: 0
            type: integer
      responses:
        "200":
          description: OK
          headers:
            X-Mirakurun-Tuner-User-ID:
              schema:
                type: string
          content:
            text/event-stream:
              x-ogen-raw-response: true
              x-ogen-sse-event-shape: data-only
              schema:
                $ref: "#/components/schemas/DataBroadcastEvent"
        "404":
          description: Not Found
          content: {}
        "503":
          description: Tuner Resource Unavailable
          content: {}
        default:
          description: Unexpected Error
          content: {}
  /services/{id}/data-broadcast/bml/components/{componentTag}/carousels/{downloadId}/modules/{moduleId}/versions/{moduleVersion}:
    parameters: []
    get:
      description: >-
        Returns the decoded resource manifest. contentLocation is null when the
        complete module maps directly to one module-scoped resource, and is a
        string only for a named multipart resource. rawUrl and resource url
        values are absolute paths rooted at the API mount.
      tags:
        - services
        - stream
      operationId: getServiceDataBroadcastModuleVersion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            maximum: 6553565535
            type: integer
            format: int64
        - name: componentTag
          in: path
          required: true
          schema:
            maximum: 255
            minimum: 0
            type: integer
        - name: downloadId
          in: path
          required: true
          schema:
            maximum: 4294967295
            minimum: 0
            type: integer
            format: int64
        - name: moduleId
          in: path
          required: true
          schema:
            maximum: 65535
            minimum: 0
            type: integer
        - name: moduleVersion
          in: path
          required: true
          schema:
            maximum: 255
            minimum: 0
            type: integer
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: OK
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              x-ogen-raw-response: true
              schema:
                $ref: "#/components/schemas/DataBroadcastModuleManifest"
        "404":
          description: Unknown or superseded module generation
          content: {}
        "304":
          description: Not Modified
          content: {}
        "410":
          description: Module generation was evicted from the completed-module cache
          content: {}
        "425":
          description: Module generation announced but not complete
          content: {}
        "507":
          description: Module exceeds receiver resource limits
          content: {}
        "422":
          description: Module entity cannot be decoded into logical resources
          content: {}
        default:
          description: Unexpected Error
          content: {}
  /services/{id}/data-broadcast/bml/components/{componentTag}/carousels/{downloadId}/modules/{moduleId}/versions/{moduleVersion}/raw:
    parameters: []
    get:
      tags: [services, stream]
      operationId: getServiceDataBroadcastModuleRaw
      parameters:
        - $ref: "#/components/parameters/DataBroadcastServiceID"
        - $ref: "#/components/parameters/DataBroadcastComponentTag"
        - $ref: "#/components/parameters/DataBroadcastDownloadID"
        - $ref: "#/components/parameters/DataBroadcastModuleID"
        - $ref: "#/components/parameters/DataBroadcastModuleVersion"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: OK
          content:
            application/octet-stream:
              x-ogen-raw-response: true
              schema: {type: string, format: binary}
        "404": {description: Unknown module generation}
        "304": {description: Not Modified}
        "410": {description: Module generation was evicted from the completed-module cache}
        "425": {description: Module generation announced but not complete}
  /services/{id}/data-broadcast/bml/components/{componentTag}/carousels/{downloadId}/modules/{moduleId}/versions/{moduleVersion}/resources/{resourceId}:
    parameters: []
    get:
      tags: [services, stream]
      operationId: getServiceDataBroadcastModuleResource
      parameters:
        - $ref: "#/components/parameters/DataBroadcastServiceID"
        - $ref: "#/components/parameters/DataBroadcastComponentTag"
        - $ref: "#/components/parameters/DataBroadcastDownloadID"
        - $ref: "#/components/parameters/DataBroadcastModuleID"
        - $ref: "#/components/parameters/DataBroadcastModuleVersion"
        - name: resourceId
          in: path
          required: true
          schema: {type: string}
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: OK
          content:
            application/octet-stream:
              x-ogen-raw-response: true
              schema: {type: string, format: binary}
        "404": {description: Unknown module generation or resource}
        "304": {description: Not Modified}
        "410": {description: Module generation was evicted from the completed-module cache}
        "425": {description: Module generation announced but not complete}
        "507": {description: Module exceeds receiver resource limits}
        "422": {description: Module entity cannot be decoded into logical resources}
  /services/{id}/programs:
    parameters: []
    get:
      tags:
        - programs
        - services
      operationId: getServicePrograms
      parameters:
        - name: id
          in: path
          required: true
          schema:
            maximum: 6553565535
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Program"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /services/{id}/logo:
    parameters: []
    get:
      tags:
        - services
      operationId: getLogoImage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            maximum: 6553565535
            type: integer
            format: int64
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: OK
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
        "304":
          description: Not Modified
          content: {}
        "404":
          description: Not Found
          content: {}
        "503":
          description: Logo Data Unavailable
          content: {}
        default:
          description: Unexpected Error
          content: {}
  /services/{id}:
    parameters: []
    get:
      tags:
        - services
      operationId: getService
      parameters:
        - name: id
          in: path
          required: true
          schema:
            maximum: 6553565535
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /programs/{id}/stream:
    parameters: []
    get:
      tags:
        - programs
        - stream
      operationId: getProgramStream
      parameters:
        - name: id
          in: path
          required: true
          schema:
            maximum: 655356553565535
            minimum: 10000000000
            type: integer
            format: int64
        - name: X-Mirakurun-Priority
          in: header
          schema:
            minimum: -1
            type: integer
        - name: decode
          in: query
          schema:
            maximum: 1
            minimum: 0
            type: integer
      responses:
        "200":
          description: OK
          headers:
            X-Mirakurun-Tuner-User-ID:
              schema:
                type: string
          content:
            video/mp2t:
              schema:
                type: string
                format: binary
        "404":
          description: Not Found
          content: {}
        "503":
          description: Tuner Resource Unavailable
          content: {}
        default:
          description: Unexpected Error
          content: {}
    head:
      tags:
        - programs
        - stream
      parameters:
        - name: id
          in: path
          required: true
          schema:
            maximum: 655356553565535
            minimum: 10000000000
            type: integer
            format: int64
        - name: X-Mirakurun-Priority
          in: header
          schema:
            minimum: -1
            type: integer
        - name: decode
          in: query
          schema:
            maximum: 1
            minimum: 0
            type: integer
      responses:
        "200":
          description: OK
          headers:
            X-Mirakurun-Tuner-User-ID:
              schema:
                type: string
          content: {}
        "404":
          description: Not Found
          content: {}
        "503":
          description: Tuner Resource Unavailable
          content: {}
        default:
